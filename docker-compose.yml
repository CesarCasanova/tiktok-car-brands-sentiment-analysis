services:
  frontend:
    image: node:20.17-slim
    volumes:
      - ./dashboard:/app
    working_dir: /app
    ports:
      - 3000:3000
    command:
      - npm
      - run
      - dev
  backend:
    build: .
    volumes:
      - ./server:/app
    working_dir: /app
    ports:
      - 8000:8000
    command: "uvicorn app:app --host 0.0.0.0 --reload"
